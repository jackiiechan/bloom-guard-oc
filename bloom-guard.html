<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bloom Guard OC</title>
<style>
  :root{
    --bg:#f6f8f6; --card:#ffffff; --fg:#0f172a; --muted:#64748b;
    --primary:#1e293b; --primary-fg:#ffffff;
    --emerald:#10b981; --emerald-d:#059669;
    --danger:#ef4444; --danger-d:#dc2626;
    --border:#e2e8f0;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--fg);background:linear-gradient(160deg,#dcefe0,#bfe3cb 55%,#d6ecdc);-webkit-font-smoothing:antialiased}
  img{display:block}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none}
  .wrap{max-width:500px;margin:0 auto;min-height:100vh;position:relative;box-shadow:0 0 70px rgba(12,40,22,.28);overflow:hidden}
  .leaf-bg{position:absolute;inset:0;background-size:cover;background-position:center;}
  .leaf-bg::after{content:"";position:absolute;inset:0;background:rgba(247,250,248,.84);backdrop-filter:blur(2px)}
  .content{position:relative;padding:0 20px 32px}
  .back{display:inline-block;font-size:13px;color:var(--muted);margin:18px 0 4px}
  .back:hover{color:var(--fg)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:600;transition:.15s;width:100%}
  .btn:active{transform:scale(.96)}
  .btn-emerald{background:var(--emerald);color:#fff}
  .btn-emerald:hover{background:var(--emerald-d)}
  .btn-primary{background:var(--primary);color:var(--primary-fg)}
  .btn-primary:hover{opacity:.9}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-danger:hover{opacity:.9}
  .btn-soft{background:#eef2f1;color:var(--fg)}
  .badge{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;padding:3px 10px;border-radius:999px}
  .badge-safe{background:rgba(16,185,129,.15);color:var(--emerald-d)}
  .badge-danger{background:rgba(239,68,68,.15);color:var(--danger-d)}
  .ring-safe{box-shadow:0 0 0 2px rgba(16,185,129,.7),0 0 0 5px rgba(16,185,129,.2)}
  .ring-danger{box-shadow:0 0 0 2px rgba(239,68,68,.7),0 0 0 5px rgba(239,68,68,.2)}
  .card{background:var(--card);border-radius:16px}
  .muted{color:var(--muted)}
  .center{text-align:center}
  /* home */
  .brand{font-size:40px;line-height:1.1;font-weight:800;color:var(--emerald-d);text-align:center;margin:0;padding-top:8px}
  .brand-heart{color:#e11d48;font-size:0.95em;vertical-align:-0.05em}
  .warn{font-size:28px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--danger);margin:10px 0}
  .lede{font-size:16px;font-weight:600;line-height:1.4}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:260px;margin:0 auto}
  .sec-h{font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 12px}
  .dot{width:10px;height:10px;border-radius:50%}
  .tile{aspect-ratio:1;width:100%;border-radius:12px;overflow:hidden;transition:.15s}
  .tile:active{transform:scale(.95)}
  .tile img{width:100%;height:100%;object-fit:cover}
  .stack>*+*{margin-top:14px}
  /* upload */
  .drop{display:block;border:2px dashed rgba(15,23,42,.25);border-radius:18px;padding:24px;text-align:center;cursor:pointer;transition:.15s;background:var(--card)}
  .drop:hover{border-color:var(--primary)}
  .pulse{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  .note-box{border-radius:12px;padding:12px 16px;font-size:14px}
  /* game */
  .field{position:relative;width:100%;aspect-ratio:4/3;border-radius:16px;overflow:hidden;box-shadow:0 0 0 2px rgba(4,120,87,.4);
    background:linear-gradient(to bottom,#bbf7d0,#dcfce7,#fef3c7)}
  .field .ground{position:absolute;left:0;right:0;bottom:0;height:33%;background:linear-gradient(to top,rgba(120,53,15,.4),transparent)}
  .field .scout{position:absolute;left:12px;bottom:12px;font-size:30px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
  .plantbtn{position:absolute;transform:translate(-50%,-50%);height:56px;width:56px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.8),0 2px 6px rgba(0,0,0,.2);transition:.15s;padding:0}
  .plantbtn img{height:100%;width:100%;object-fit:cover}
  .plantbtn.sel{box-shadow:0 0 0 3px var(--primary),0 6px 14px rgba(0,0,0,.3);transform:translate(-50%,-50%) scale(1.1)}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(246,248,246,.85);backdrop-filter:blur(3px)}
  .scan-result{border-radius:12px;padding:12px;text-align:center;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
  .row{display:flex;align-items:center;gap:12px}
  .pill{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em}
  .bin{border-radius:12px;padding:12px;background:var(--card)}
  .bingrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .binimg{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px rgba(15,23,42,.15)}
  .binimg img{width:100%;height:100%;object-fit:cover}
  .sprayed-tag{position:absolute;left:0;right:0;bottom:0;background:rgba(239,68,68,.9);color:#fff;font-size:8px;font-weight:800;text-align:center;padding:1px 0}
  .demo-tag{font-size:11px;color:var(--muted);margin-top:6px}
  h1.title{font-size:24px;font-weight:800;margin:12px 0 4px}
  h2.det{font-size:20px;font-weight:800;margin:12px 0 6px}
</style>
</head>

/* ---------- user plant store (localStorage) ---------- */
const STORAGE_KEY = "user-plants-v1";
function readUserPlants(){
  try{const raw=localStorage.getItem(STORAGE_KEY);return raw?JSON.parse(raw):[]}catch{return []}
}
function addUserPlant(p){
  const items=readUserPlants();
  const next={...p,userAdded:true,createdAt:Date.now()};
  localStorage.setItem(STORAGE_KEY,JSON.stringify([next,...items])); // may throw on quota
  return next;
}
function allPlants(){return [...readUserPlants(),...PLANT_LIST];}

/* ---------- helpers ---------- */
const $=(sel,el=document)=>el.querySelector(sel);
const el=(html)=>{const t=document.createElement("template");t.innerHTML=html.trim();return t.content.firstElementChild;};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
const app=$("#app");
const bg=`style="background-image:url('${IMG.bg}')"`;
// Cosmetic only: fill the full viewport behind the app with the leafy backdrop.
document.body.style.background=`linear-gradient(rgba(244,250,245,.55),rgba(238,247,241,.6)), url('${IMG.bg}') center/cover fixed`;

/* ---------- router ---------- */
function parseHash(){
  const h=location.hash.replace(/^#/,"");
  if(h.startsWith("/plant/"))return{view:"plant",id:decodeURIComponent(h.slice("/plant/".length))};
  if(h==="/upload")return{view:"upload"};
  if(h==="/plants")return{view:"plants"};
  if(h==="/game")return{view:"game"};
  return{view:"home"};
}
function go(path){location.hash=path;}
function render(){
  const r=parseHash();
  document.title = ({home:"Bloom Guard OC",upload:"Upload Your Plant",plants:"Plant Inventory",game:"Plant Patrol",plant:"Plant — Bloom Guard"})[r.view];
  app.innerHTML="";
  ({home:viewHome,upload:viewUpload,plants:viewPlants,game:viewGame,plant:viewPlant})[r.view](r);
  try{window.scrollTo(0,0);}catch(_){}
}
window.addEventListener("hashchange",render);

/* ---------- views ---------- */
function plantTile(p){
  const t=el(`<a class="tile ${p.tone==="safe"?"ring-safe":"ring-danger"}" href="#/plant/${encodeURIComponent(p.id)}">
    <img src="${p.image}" alt="${esc(p.name)}" loading="lazy"></a>`);
  return t;
}
function viewHome(){
  const safe=PLANT_LIST.filter(p=>p.tone==="safe");
  const danger=PLANT_LIST.filter(p=>p.tone==="danger");
  const root=el(`<div class="leaf-wrap"></div>`);
  const leaf=el(`<div class="leaf-bg" ${bg}></div>`);
  const c=el(`<div class="content"></div>`);
  c.appendChild(el(`<section class="center" style="padding-top:24px">
      <h1 class="brand">I <span class="brand-heart">❤️</span> Nature</h1>
      <p class="warn">Warning!</p>
      <h1 class="lede">Gardeners are spraying plants in our communities to keep the weeds away, but they contain toxic chemicals getting residents sick, and they are passing away. What are we going to do about this?</h1>
    </section>`));
  const actions=el(`<div class="stack" style="margin:22px 0"></div>`);
  const b1=el(`<a class="btn btn-emerald" href="#/upload">📷 Upload Your Plant</a>`);
  const b2=el(`<a class="btn btn-primary" href="#/plants">View Plant Details</a>`);
  const b3=el(`<a class="btn btn-danger" href="#/game">🎮 Play Plant Patrol</a>`);
  actions.append(b1,b2,b3);
  c.appendChild(actions);
  const safeSec=el(`<div><h2 class="sec-h"><span class="dot" style="background:var(--emerald)"></span>Safe</h2></div>`);
  const safeGrid=el(`<div class="grid2"></div>`);safe.forEach(p=>safeGrid.appendChild(plantTile(p)));safeSec.appendChild(safeGrid);
  const dangerSec=el(`<div style="margin-top:22px"><h2 class="sec-h"><span class="dot" style="background:var(--danger)"></span>Danger</h2></div>`);
  const dangerGrid=el(`<div class="grid2"></div>`);danger.forEach(p=>dangerGrid.appendChild(plantTile(p)));dangerSec.appendChild(dangerGrid);
  c.append(safeSec,dangerSec);
  root.append(leaf,c);app.appendChild(root);
}
function viewPlant(r){
  const p=PLANTS[r.id]||readUserPlants().find(x=>x.id===r.id);
  const leaf=el(`<div class="leaf-bg" ${bg}></div>`);app.appendChild(leaf);
  const c=el(`<div class="content"></div>`);
  c.appendChild(el(`<a class="back" href="#/">← Back</a>`));
  if(!p){
    c.appendChild(el(`<div class="center" style="margin-top:40px"><p>Plant not found.</p><a class="back" href="#/">Back to home</a></div>`));
    app.appendChild(c);return;
  }
  const safe=p.tone==="safe";
  c.appendChild(el(`<div class="card ${safe?"ring-safe":"ring-danger"}" style="max-width:340px;margin:8px auto 0;overflow:hidden">
      <img src="${p.image}" alt="${esc(p.name)}" style="width:100%;aspect-ratio:1;object-fit:cover"></div>`));
  c.appendChild(el(`<div class="center" style="max-width:340px;margin:18px auto 0">
      <span class="badge ${safe?"badge-safe":"badge-danger"}">${safe?"Safe":"Danger"}</span>
      <h1 class="title">${esc(p.name)}</h1>
      <p style="font-weight:500">${esc(p.summary)}</p>
      <p class="muted" style="margin-top:14px;line-height:1.5">${esc(p.details)}</p></div>`));
  app.appendChild(c);
}

  const leaf=el(`<div class="leaf-bg" ${bg}></div>`);app.appendChild(leaf);
  const c=el(`<div class="content"></div>`);

        <img src="${p.image}" alt="${esc(p.name)}" style="width:96px;height:96px;object-fit:cover;border-radius:12px;flex-shrink:0">
        <div style="flex:1">
          <span class="badge ${safe?"badge-safe":"badge-danger"}">${safe?"Safe":"Danger"}</span>
          <h2 class="det" style="font-size:17px;margin:8px 0 4px">${esc(p.name)}</h2>
          <p style="font-weight:500;font-size:14px;margin:0">${esc(p.summary)}</p>
          <p class="muted" style="font-size:14px;line-height:1.5;margin:8px 0 0">${esc(p.details)}</p>
        </div></article>`));

/* ---------- upload (demo identifier) ---------- */
const MAX_DIM=1024,JPEG_Q=0.8;
function fileToScaledDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(reader.error||new Error("Could not read the file."));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("That file doesn't look like a valid image."));
      img.onload=()=>{
        const scale=Math.min(1,MAX_DIM/Math.max(img.width,img.height));
        const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
        const cv=document.createElement("canvas");cv.width=w;cv.height=h;
        const ctx=cv.getContext("2d");
        if(!ctx){resolve(String(reader.result));return;}
        ctx.drawImage(img,0,0,w,h);resolve(cv.toDataURL("image/jpeg",JPEG_Q));
      };
      img.src=String(reader.result);
    };
    reader.readAsDataURL(file);
  });
}
function demoIdentify(){
  // No server/API key in a standalone HTML file — simulate a botanist result.
  return new Promise(resolve=>{
    setTimeout(()=>{
      const pick=DEMO_CANDIDATES[Math.floor(Math.random()*DEMO_CANDIDATES.length)];
      resolve({...pick});
    },900);
  });
}
function viewUpload(){
  const c=el(`<div class="content"></div>`);
  c.appendChild(el(`<a class="back" href="#/">← Back</a>`));
  c.appendChild(el(`<h1 class="title">Upload Your Plant</h1>`));
  c.appendChild(el(`<p class="muted" style="font-size:14px;margin:0 0 6px">Snap or upload a photo of a plant you found in your community. We'll identify it, share details, and add it to your inventory and the Plant Patrol game.</p>`));
  c.appendChild(el(`<p class="demo-tag">Demo mode: this standalone file identifies plants locally (no AI key required).</p>`));
  const label=el(`<label class="drop" style="margin-top:8px">
      <input type="file" accept="image/*" capture="environment" style="display:none">
      <div class="ph"><p style="font-size:36px;margin:0 0 6px">📷</p>
      <p style="font-weight:600;margin:0">Tap to take a photo or upload</p>
      <p class="muted" style="font-size:12px;margin:4px 0 0">JPG or PNG of a real plant</p></div></label>`);
  const status=el(`<div class="status" style="margin-top:16px"></div>`);
  c.append(label,status);app.appendChild(c);
  const input=$("input",label);
  input.addEventListener("change",async()=>{
    const file=input.files&&input.files[0];input.value="";
    if(!file)return;
    status.innerHTML="";
    if(!file.type.startsWith("image/")){status.appendChild(errBox("Please choose an image file (JPG or PNG)."));return;}
    if(file.size>25*1024*1024){status.appendChild(errBox("That image is too large. Please pick one under 25 MB."));return;}
    let dataUrl;
    try{dataUrl=await fileToScaledDataUrl(file);}catch(e){status.appendChild(errBox(e.message||"Could not read that image."));return;}
    label.querySelector(".ph")?.remove();
    let prev=label.querySelector("img.prev");
    if(!prev){prev=el(`<img class="prev" alt="Selected plant" style="margin:0 auto;max-height:256px;border-radius:10px;object-fit:cover">`);label.appendChild(prev);}
    prev.src=dataUrl;
    status.innerHTML=`<div class="note-box pulse center" style="background:#eef2f1;font-weight:600">Identifying plant…</div>`;
    try{
      const r=await demoIdentify();
      let note="✓ Added to your plant inventory and Plant Patrol game";
      try{
        addUserPlant({id:`user-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,name:r.name,tone:r.tone,image:dataUrl,summary:r.summary,details:r.details});
      }catch{note="Identified, but couldn't save to your inventory (storage may be full).";}
      status.innerHTML="";status.appendChild(resultCard(r,note));
    }catch(e){status.innerHTML="";status.appendChild(errBox(e.message||"Identification failed."));}
  });
}
function errBox(msg){return el(`<div class="note-box" style="background:rgba(239,68,68,.1);color:var(--danger-d)">${esc(msg)}</div>`);}
function resultCard(r,note){
  const safe=r.tone==="safe";
  const card=el(`<div class="card ${safe?"ring-safe":"ring-danger"}" style="padding:16px">
      <span class="badge ${safe?"badge-safe":"badge-danger"}">${safe?"Safe":"Danger"}</span>
      <h2 class="det">${esc(r.name)}</h2>
      <p style="font-weight:500;margin:4px 0 0">${esc(r.summary)}</p>
      <p class="muted" style="line-height:1.5;margin:8px 0 0">${esc(r.details)}</p>
      <p style="color:var(--emerald-d);font-size:12px;font-weight:600;margin:12px 0 0">${esc(note)}</p>
      <div class="row" style="margin-top:16px">
        <button class="btn btn-soft again" style="flex:1">Upload another</button>
        <button class="btn btn-primary inv" style="flex:1">View inventory</button>
      </div></div>`);
  card.querySelector(".again").addEventListener("click",()=>render());
  card.querySelector(".inv").addEventListener("click",()=>go("/plants"));
  return card;
}

/* ---------- game ---------- */
const CHARACTERS=[{emoji:"🧑‍🌾",name:"Rin the Farmer"},{emoji:"🧑‍🔬",name:"Dr. Vega"},{emoji:"🕵️",name:"Scout Mika"},{emoji:"🧑‍🚀",name:"Captain Fern"},{emoji:"🧙",name:"Sage Willow"}];
const rand=a=>a[Math.floor(Math.random()*a.length)];
function buildField(pool){
  const items=[];if(!pool.length)return items;
  for(let i=0;i<6;i++){const plant=rand(pool);
    items.push({key:`${plant.id}-${i}-${Math.random().toString(36).slice(2,7)}`,plant,
      sprayed:Math.random()<(plant.tone==="danger"?0.7:0.35),scan:"unscanned",collected:false,
      x:10+Math.random()*75,y:15+Math.random()*65});}
  return items;
}
function viewGame(){
  const G={character:rand(CHARACTERS),field:buildField(allPlants()),selectedKey:null,inventory:[],round:1};
  const root=el(`<div class="content"></div>`);app.appendChild(root);
  function selected(){return G.field.find(p=>p.key===G.selectedKey)||null;}
  function rerender(){
    root.innerHTML="";
    const remaining=G.field.filter(p=>!p.collected).length;
    root.appendChild(el(`<header style="display:flex;align-items:center;justify-content:space-between;padding:18px 0 8px">
        <a class="back" style="margin:0" href="#/">← Back</a>
        <h1 style="font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin:0">Plant Patrol</h1>
        <span style="font-size:13px;font-weight:600;color:var(--primary)">Round ${G.round}</span></header>`));
    root.appendChild(el(`<section class="row" style="padding-bottom:10px">
        <div style="height:48px;width:48px;border-radius:50%;background:rgba(30,41,59,.12);box-shadow:0 0 0 2px rgba(30,41,59,.3);display:flex;align-items:center;justify-content:center;font-size:24px">${G.character.emoji}</div>
        <div style="flex:1"><p class="muted pill" style="margin:0">Scout</p><p style="font-weight:800;margin:2px 0 0">${esc(G.character.name)}</p></div>
        <div class="center"><p class="muted" style="font-size:12px;margin:0">Plants left</p><p style="font-weight:800;font-size:16px;margin:0">${remaining}</p></div>
      </section>`));
    // field
    const field=el(`<div class="field"><div class="ground"></div><div class="scout">${G.character.emoji}</div></div>`);
    G.field.filter(f=>!f.collected).forEach(fp=>{
      const b=el(`<button class="plantbtn ${G.selectedKey===fp.key?"sel":""}" style="left:${fp.x}%;top:${fp.y}%" aria-label="Investigate ${esc(fp.plant.name)}"><img src="${fp.plant.image}" alt="" loading="lazy"></button>`);
      b.addEventListener("click",()=>{G.selectedKey=fp.key;rerender();});
      field.appendChild(b);
    });
    if(remaining===0){
      const ov=el(`<div class="overlay"><p style="font-size:18px;font-weight:800">Field cleared! 🌿</p></div>`);
      const nb=el(`<button class="btn btn-primary" style="width:auto;padding:10px 20px">Explore a new area</button>`);
      nb.addEventListener("click",()=>{G.field=buildField(allPlants());G.selectedKey=null;G.round++;rerender();});
      ov.appendChild(nb);field.appendChild(ov);
    }
    const fieldWrap=el(`<section></section>`);fieldWrap.appendChild(field);root.appendChild(fieldWrap);
    // scanner
    const scan=el(`<section style="padding:16px 0"></section>`);
    const sel=selected();
    if(sel){
      const panel=el(`<div class="card" style="padding:16px;box-shadow:0 0 0 2px rgba(15,23,42,.12)"></div>`);
      panel.appendChild(el(`<div class="row"><img src="${sel.plant.image}" alt="" style="height:64px;width:64px;border-radius:10px;object-fit:cover;box-shadow:0 0 0 2px rgba(15,23,42,.15)">
          <div style="flex:1"><p class="muted pill" style="margin:0">Plant found</p>
          <p style="font-weight:800;margin:2px 0 0">${esc(sel.plant.name)}</p>
          <p class="muted" style="font-size:12px;margin:2px 0 0">${esc(sel.plant.summary)}</p></div></div>`));
      if(sel.scan==="unscanned"){
        const sb=el(`<button class="btn btn-primary" style="margin-top:12px">📡 Scan for chemicals</button>`);
        sb.addEventListener("click",()=>{
          G.field=G.field.map(p=>p.key===sel.key?{...p,scan:"scanning"}:p);rerender();
          setTimeout(()=>{G.field=G.field.map(p=>p.key===sel.key?{...p,scan:"scanned"}:p);rerender();},900);
        });
        panel.appendChild(sb);
      }else if(sel.scan==="scanning"){
        panel.appendChild(el(`<div class="note-box pulse center" style="background:#eef2f1;font-weight:600;margin-top:12px">Scanning…</div>`));
      }else{
        panel.appendChild(el(`<div class="scan-result" style="margin-top:12px;color:#fff;background:${sel.sprayed?"var(--danger)":"var(--emerald)"}">${sel.sprayed?"⚠ Chemical spray detected":"✓ No chemicals found"}</div>`));
        const cb=el(`<button class="btn" style="margin-top:8px;background:var(--fg);color:var(--bg)">+ Add to inventory</button>`);
        cb.addEventListener("click",()=>{
          G.inventory=[{key:sel.key,plant:sel.plant,sprayed:sel.sprayed,filed:null},...G.inventory];
          G.field=G.field.map(p=>p.key===sel.key?{...p,collected:true}:p);G.selectedKey=null;rerender();
        });
        panel.appendChild(cb);
      }
      scan.appendChild(panel);
    }else{
      scan.appendChild(el(`<div class="note-box center muted" style="border:2px dashed rgba(15,23,42,.2)">Tap a plant in the field to investigate it.</div>`));
    }
    root.appendChild(scan);
    // inventory
    const pending=G.inventory.filter(i=>i.filed===null);
    const safeFiled=G.inventory.filter(i=>i.filed==="safe");
    const dangerFiled=G.inventory.filter(i=>i.filed==="danger");
    const invSec=el(`<section class="stack" style="padding-bottom:24px"></section>`);
    invSec.appendChild(el(`<h2 style="font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin:0">🎒 Inventory (${pending.length} to file)</h2>`));
    if(!pending.length){
      invSec.appendChild(el(`<p class="muted" style="font-size:12px;margin:0">Nothing pending. Scan and collect plants from the field.</p>`));
    }else{
      const list=el(`<div class="stack"></div>`);
      pending.forEach(it=>{
        const rowEl=el(`<div class="row card" style="padding:8px;box-shadow:0 0 0 1px rgba(15,23,42,.12)">
            <img src="${it.plant.image}" alt="" style="height:48px;width:48px;border-radius:8px;object-fit:cover">
            <div style="flex:1;min-width:0"><p style="font-weight:600;font-size:14px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(it.plant.name)}</p>
            <p class="pill" style="margin:2px 0 0;color:${it.sprayed?"var(--danger-d)":"var(--emerald-d)"}">${it.sprayed?"Sprayed":"Clean"}</p></div></div>`);
        const sBtn=el(`<button class="btn btn-emerald" style="width:auto;padding:8px 12px;font-size:12px">Safe</button>`);
        const dBtn=el(`<button class="btn btn-danger" style="width:auto;padding:8px 12px;font-size:12px">Danger</button>`);
        sBtn.addEventListener("click",()=>{G.inventory=G.inventory.map(x=>x.key===it.key?{...x,filed:"safe"}:x);rerender();});
        dBtn.addEventListener("click",()=>{G.inventory=G.inventory.map(x=>x.key===it.key?{...x,filed:"danger"}:x);rerender();});
        rowEl.append(sBtn,dBtn);list.appendChild(rowEl);
      });
      invSec.appendChild(list);
    }
    const bins=el(`<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:8px"></div>`);
    bins.appendChild(bin("Safe","safe",safeFiled));
    bins.appendChild(bin("Danger","danger",dangerFiled));
    invSec.appendChild(bins);
    root.appendChild(invSec);
  }
  function bin(title,tone,items){
    const b=el(`<div class="bin" style="box-shadow:0 0 0 2px ${tone==="safe"?"rgba(16,185,129,.6)":"rgba(239,68,68,.6)"}">
        <h3 style="font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px;display:flex;align-items:center;gap:8px">
        <span class="dot" style="background:${tone==="safe"?"var(--emerald)":"var(--danger)"}"></span>${title} (${items.length})</h3></div>`);
    if(!items.length){b.appendChild(el(`<p class="muted" style="font-size:11px;margin:0">Empty</p>`));}
    else{const g=el(`<div class="bingrid"></div>`);
      items.forEach(it=>g.appendChild(el(`<div class="binimg"><img src="${it.plant.image}" alt="">${it.sprayed?'<span class="sprayed-tag">SPRAYED</span>':''}</div>`)));
      b.appendChild(g);}
    return b;
  }
  rerender();
}

render();
</script>
